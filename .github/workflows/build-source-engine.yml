name: Build Lumi Source Engine

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: feature/legado-source-engine
  push:
    branches: [feature/legado-source-engine]

permissions:
  contents: read

concurrency:
  group: lumi-source-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs
        id: build
        continue-on-error: true
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace 2>&1 | tee gradle-build.log

      - name: Publish Gradle diagnostics
        if: always()
        run: |
          {
            echo '## Gradle diagnostic summary'
            echo
            echo '### Matching errors and warnings'
            grep -E '(^e: |FAILURE:|What went wrong:|Execution failed|Could not |error:|w: )' gradle-build.log | tail -200 || true
            echo
            echo '### Last 120 log lines'
            tail -120 gradle-build.log || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop after failed build
        if: steps.build.outcome != 'success'
        run: exit 1

      - name: Verify APK outputs
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"


      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: lumi-books-source-arm64-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: lumi-books-source-universal-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: error
          retention-days: 14
