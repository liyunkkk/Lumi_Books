name: Build And Upload To Release
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
      tag:
        description: Release tag to create/update
        required: true
permissions:
  contents: write
concurrency:
  group: lumi-release-upload-${{ github.event.inputs.tag }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace 2>&1 | tee gradle-build.log
      - name: Locate APK
        id: locate
        run: |
          APK_ROOT=""
          for p in app/build/oss/outputs/apk app/build/outputs/apk; do
            if [ -d "$p" ]; then APK_ROOT="$p"; break; fi
          done
          echo "APK_ROOT=$APK_ROOT" >> "$GITHUB_ENV"
          find "$APK_ROOT" -type f -name '*.apk' -print
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          draft: false
          prerelease: true
          files: ${{ env.APK_ROOT }}/release/*.apk
